<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .e { stroke: #1f1f1d; stroke-width: 1.4; stroke-linejoin: round; }
    .p { fill: #fcfcfa; } .s { fill: #d9d9d4; } .l { fill: #8ea6ec; } .ls { fill: #6f8ce4; } .r { fill: #b9b9b2; }
