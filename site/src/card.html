<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>buildnotes social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Martian+Mono:wdth,wght@75..112.5,300..500&family=Shantell+Sans:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* The 1200 × 630 card that link previews show (og:image). site/card.mjs renders it to site/assets/og.png.
   Same palette and faces as the page; the headline on the left, the live card from the weekly-digests example on the right. */
:root {
  --paper: #fcfcfa;
  --ink: #1f1f1d;
  --muted: #64645f;
  --rule: #e3e3dd;
  --wash: #f1f1ec;
  --accent: #3358d4;
  --mark: #df004e;
  --dot: #d8d8d1;
  --landmark: #f2b81c;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: var(--font-display);
  --font-mono: "Martian Mono", ui-monospace, Menlo, monospace;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-hand: "Shantell Sans", "Comic Neue", cursive;
  --font-label: var(--font-mono);
  --label-stretch: 87.5%;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
.card { display: grid; grid-template-columns: 540px 1fr; width: 1200px; height: 630px; }
.words { padding: 64px 36px 56px 72px; display: flex; flex-direction: column; }
.name { font: 400 18px/1 var(--font-mono); font-stretch: 87.5%; color: var(--muted); }
h1 { margin: 40px 0 0; font: 600 50px/1.08 var(--font-display); letter-spacing: -0.015em; }
h1 span { display: block; margin-top: 18px; color: var(--muted); font-weight: 400; font-size: 38px; }
.cmd { margin-top: auto; font: 400 17px/1 var(--font-code); color: var(--ink); }
.cmd b { color: var(--muted); font-weight: 400; }
.figure {
  margin: 28px 28px 28px 8px; border: 1px solid var(--rule); border-radius: 6px;
  background: radial-gradient(circle, var(--dot) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--paper);
  display: grid; place-items: center; overflow: hidden;
}
.figure .anatomy { width: 100%; padding: 0 20px; box-sizing: border-box; }
.figure .keys, .figure .parts-view { display: none; }
.figure .hs .dot { width: 26px; height: 26px; font-size: 14px; }

/* template: keyed-anatomy */
</style>
</head>
<body>
<div class="card">
  <div class="words">
    <div class="name">buildnotes</div>
    <h1>Turn pull requests into posts and videos worth sharing. <span>How it was built, and why.</span></h1>
    <div class="cmd"><b>$</b> npx skills add buildinternet/buildnotes</div>
  </div>
  <div class="figure"><!-- figure anatomy examples/releases-weekly-digests/viz/card.json --></div>
</div>
</body>
</html>
