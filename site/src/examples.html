<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examples · buildnotes</title>
<meta name="description" content="Three real features, each made into a post, a video and slides: walkthrough videos in Sunny, before and after screenshots in Uploads, and weekly digests in Release Notes Index.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fcfcfa">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<!-- share -->
<link rel="preload" href="../assets/fonts/source-serif-4-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/archivo-normal-400-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/ibm-plex-mono-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
/* The home page's stylesheet, pasted by site/build.mjs, then the list below. */
/* site: css */

section.list { border-top: 0; padding-block: 32px 64px; gap: 40px; }
.examples { display: grid; gap: 40px; }
.examples > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.examples > div > div { display: grid; gap: 8px; align-content: start; }
.examples img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top; border-radius: 4px; border: 1px solid var(--rule); }
/* In one column the picture is full width, so it shows whole rather than cropped to 4:3. */
@media (max-width: 719px) { .examples img { aspect-ratio: auto; } }
.show-head h1 { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.2; }
.examples h2 { font-family: var(--font-display); font-size: 1.375rem; line-height: 1.2; }
.examples h2 a { color: var(--ink); text-decoration: none; }
.examples h2 a:hover { text-decoration: underline; }
.examples p { font-family: var(--font-body); font-size: 1rem; color: var(--muted); line-height: 1.5; max-width: 38rem; }
.examples p.formats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-label); font-size: 0.6875rem; font-stretch: var(--label-stretch); letter-spacing: 0.02em; margin-top: 4px; }
.examples p.formats a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 0.25em; }
.examples p.formats a:hover { color: var(--ink); text-decoration-color: var(--ink); }
@media (min-width: 720px) {
  .examples > div { grid-template-columns: 14rem minmax(0, 1fr); align-items: start; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="name" href="../" id="top">buildnotes</a>
    <nav aria-label="Site">
      <a href="./" aria-current="page">Examples</a>
      <a href="../#how">How it works</a>
      <a href="../#makes">Outputs</a>
      <a href="../#install">Install</a>
      <a href="https://github.com/buildinternet/buildnotes">GitHub</a>
    </nav>
  </header>

  <section class="list" aria-labelledby="ex-h">
    <div class="show-head">
      <h1 id="ex-h">Examples</h1>
    </div>
    <div class="examples">
<!-- examples -->
    </div>
  </section>

<!-- footer -->
</div>
</body>
</html>
