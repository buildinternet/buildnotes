<!doctype html>
<meta charset="utf-8">
<title>Motion Cut</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Motion cut template: a build story as a short reel that plays itself.
  Don't edit this copy by hand. Write <work-dir>/motion.json (references/motion.md) and run
    node scripts/motion.mjs <work-dir>/motion.json            → <work-dir>/motion.html, one self-contained page
    node scripts/motion.mjs <work-dir>/motion.json --mp4      → and <work-dir>/export/motion.mp4
  motion.mjs checks the script, sets each scene's length, embeds the images, and fills the two JSON blocks below.
  Every frame is a function of the clock: each scene draws itself from its own time, so the scrubber is exact
  and export.mjs can step the stage frame by frame. The stage is a fixed 1920×1080 canvas scaled to fit.
  Tokens follow the post template's Plain style. A brand (the repo's brand.json) is written in after these
  styles by motion.mjs and deck.mjs; don't edit the tokens here.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: one page column holding the screen (64rem wide, the width motion.mjs exports from) and its controls.
   Inside the screen, the stage is drawn in 1920×1080 units and scaled. */
:root {
  --paper: #ffffff; --ink: #161616; --muted: #616161; --rule: #e4e4e4; --wash: #f2f2f2;
  --accent: #3358d4; --accent-wash: #e8edfb; --mark: #df004e; --dim: #c2c2c2;
  --hero: #3358d4; --hero-ink: #ffffff; --hero-muted: rgb(255 255 255 / 0.74);
  /* Series colours for a morph's parts, by name in the script. */
  --green: #22c55e; --blue: #3b82f6; --red: #fecaca; --yellow: #f2b81c; --gray: #c9c9c9;
  --tile-head: #f3f3f1; --edge: rgb(0 0 0 / 0.08); --shadow: 0 30px 80px -30px rgb(0 0 0 / 0.35);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Newsreader", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #131415; --ink: #ececea; --muted: #9c9c99; --rule: #2a2b2d; --wash: #1c1d1f;
  --accent: #8aa6f5; --accent-wash: #1c2440; --mark: #ff3264; --dim: #4a4d52;
  --hero: #1f3170; --hero-ink: #f1f3fb; --hero-muted: rgb(241 243 251 / 0.7);
  --red: #6b3434; --gray: #3c3e42; --tile-head: #222325;
  --edge: rgb(255 255 255 / 0.09); --shadow: 0 30px 80px -30px rgb(0 0 0 / 0.8); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #131415; --ink: #ececea; --muted: #9c9c99; --rule: #2a2b2d; --wash: #1c1d1f;
  --accent: #8aa6f5; --accent-wash: #1c2440; --mark: #ff3264; --dim: #4a4d52;
  --hero: #1f3170; --hero-ink: #f1f3fb; --hero-muted: rgb(241 243 251 / 0.7);
  --red: #6b3434; --gray: #3c3e42; --tile-head: #222325;
  --edge: rgb(255 255 255 / 0.09); --shadow: 0 30px 80px -30px rgb(0 0 0 / 0.8); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.55 var(--font-body); }
.page { max-width: 68rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; display: grid; gap: 1.25rem; justify-items: center; }
.top { width: min(100%, 64rem); display: grid; gap: 0.5rem; }
.top .kicker { font: 500 0.75rem/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mark); }
.top h1 { font-family: var(--font-display); font-weight: 800; font-stretch: 86%; font-size: clamp(1.75rem, 4.5vw, 2.6rem); line-height: 1.02; margin: 0; text-wrap: balance; }
.top p { margin: 0; color: var(--muted); }
.top a { color: var(--accent); }

.screen { position: relative; width: min(100%, 64rem); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px var(--edge), var(--shadow); background: var(--paper); cursor: pointer; user-select: none; -webkit-user-select: none; }
.bar { width: min(100%, 64rem); display: flex; align-items: center; gap: 0.75rem; font: 400 0.8125rem/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar button { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 999px; background: var(--ink); color: var(--paper); font: 500 0.8125rem/1 var(--font-mono); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.scrub { position: relative; flex: 1; min-width: 0; height: 2.25rem; }
.scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
.scrub .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: var(--rule); border-radius: 2px; pointer-events: none; }
.scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
.scrub .tick { position: absolute; top: -5px; width: 2px; height: 14px; background: var(--paper); }
.scrub .tick::after { content: ""; position: absolute; left: 0; top: 3px; width: 2px; height: 8px; background: var(--muted); }
.scrub input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 6px; }
.chap { flex: 0 1 16rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { font: 400 0.75rem/1.4 var(--font-mono); color: var(--muted); text-align: center; }
@media (max-width: 40rem) { .chap { display: none; } }

/* Deck mode (deck.mjs sets "deck" in the script): one scene per slide, a counter in place of the scrubber.
   Full screen letterboxes the stage; print lays every slide out at rest, one to a 1920×1080 page. */
.deck .bar .chap { flex: 1 1 auto; }
.deck .bar button:disabled { opacity: 0.3; cursor: default; }
.deck .bar #full { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); }
.count { min-width: 3.5rem; text-align: center; }
.screen:fullscreen { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
@media print {
  html.deck { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .deck body { margin: 0; }
  .deck .page { display: block; max-width: none; margin: 0; padding: 0; }
  .deck .top, .deck .bar, .deck .hint { display: none; }
  .deck .screen { width: auto; aspect-ratio: auto; overflow: visible; border-radius: 0; box-shadow: none; }
  .deck .stage { position: static; width: auto; height: auto; overflow: visible; transform: none !important; }
  .deck .scene, .deck .scene[hidden] { display: block; position: relative; width: 1920px; height: 1080px; overflow: hidden; break-after: page; opacity: 1 !important; transform: none !important; }
  .deck .scene:last-child { break-after: auto; }
}

/* ---------- the stage, in 1920×1080 units ---------- */
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--paper); color: var(--ink); overflow: hidden; }
.scene { position: absolute; inset: 0; background: var(--paper); }
.scene.hero { background: var(--hero); color: var(--hero-ink); }
.meta { position: absolute; left: 120px; right: 120px; top: 64px; display: flex; justify-content: space-between; gap: 40px; font: 500 22px/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.hero .meta { color: var(--hero-muted); }
.copy { position: absolute; left: 120px; top: 230px; width: 600px; }
.copy.full { width: 1560px; }
.k { font: 500 26px/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mark); }
.hero .k { color: var(--hero-muted); }
.hd { font-family: var(--font-display); font-weight: 800; font-stretch: 86%; font-size: 92px; line-height: 0.98; letter-spacing: -0.012em; margin: 26px 0 0; text-wrap: balance; }
.k + .hd, .hd:first-child { margin-top: 26px; }
.hd.big { font-size: 156px; line-height: 0.92; }
.hd .w { display: inline-block; }
.sub { font: 400 40px/1.32 var(--font-body); color: var(--muted); margin: 34px 0 0; text-wrap: pretty; }
.hero .sub { color: var(--hero-muted); }
em { font-style: normal; background: linear-gradient(var(--mark), var(--mark)) 0 92% / var(--u, 100%) 10px no-repeat; }
.hero em { background-image: linear-gradient(var(--hero-ink), var(--hero-ink)); }
.swap { position: relative; }
.swap > .hd { position: absolute; left: 0; top: 0; width: 100%; margin-top: 26px; }

/* title: optional ticks with a playhead */
.ticks { position: absolute; left: 120px; right: 120px; bottom: 120px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 2px solid var(--hero-muted); }
.ticks span { padding-top: 22px; font: 500 26px/1 var(--font-mono); letter-spacing: 0.06em; color: var(--hero-muted); white-space: nowrap; }
.ticks i { position: absolute; top: -14px; width: 4px; height: 28px; margin-left: -2px; background: var(--hero-ink); border-radius: 2px; }

/* statement */
.lines { position: absolute; left: 120px; top: 260px; width: 1600px; display: grid; gap: 40px; }
.lines .hd { margin: 0; font-size: 124px; }

/* list */
.items { position: absolute; left: 120px; right: 120px; top: 470px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 48px; }
.items > div { border-top: 4px solid var(--ink); padding-top: 34px; display: grid; gap: 26px; align-content: start; }
.items svg, .items img { width: 200px; height: 150px; display: block; object-fit: contain; object-position: left center; }
.items b { font: 700 50px/1.05 var(--font-display); font-stretch: 88%; }
.items p { margin: 12px 0 0; font: 400 34px/1.3 var(--font-body); color: var(--muted); }

/* shot and swap: an image fitted into the right-hand box */
.pic { position: absolute; border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 2px var(--edge), var(--shadow); background: var(--paper); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pic .dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pic .light.has-dark { display: none; } :root:not([data-theme="light"]) .pic .dark { display: block; } }
:root[data-theme="dark"] .pic .light.has-dark { display: none; }
:root[data-theme="dark"] .pic .dark { display: block; }
.ring { position: absolute; border: 6px solid var(--mark); border-radius: 16px; box-shadow: 0 0 0 9999px rgb(0 0 0 / 0.16); pointer-events: none; }
.chip { position: absolute; white-space: nowrap; background: var(--mark); color: #fff; font: 600 28px/1 var(--font-display); font-stretch: 92%; padding: 14px 20px; border-radius: 12px; }
.wipe { position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -2px; background: #fff; box-shadow: 0 0 30px 6px rgb(255 255 255 / 0.5); }
.say-on { position: absolute; left: 24px; bottom: 24px; background: rgb(255 255 255 / 0.94); color: #161616; font: 600 28px/1 var(--font-display); padding: 12px 18px; border-radius: 10px; }
.say-on.at-top { top: 24px; bottom: auto; } /* "sayAt": "top", when the footage has its own caption at the bottom */

/* clip: the product's own footage, as frames on one sprite sheet, stepped by the clock */
.film { position: absolute; inset: 0; background-repeat: no-repeat; }

/* morph */
.tm { position: absolute; transform-origin: 0 0; }
.tile { position: absolute; border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: 70px 1fr; background: var(--tile-head); }
.tile header { display: flex; align-items: baseline; gap: 14px; padding: 0 22px; align-self: center; white-space: nowrap; overflow: hidden; min-width: 0; }
.tile header b { font: 600 32px/1 var(--font-display); font-stretch: 92%; flex: none; }
.tile header span { font: 400 24px/1 var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tile .body { display: flex; position: relative; min-height: 0; background: var(--accent); }
.tile .body i { display: block; height: 100%; }
.tile .body small { position: absolute; left: 18px; bottom: 16px; font: 500 26px/1 var(--font-mono); color: var(--ink); background: color-mix(in oklab, var(--paper) 80%, transparent); padding: 6px 8px; border-radius: 6px; }
.tag { position: absolute; font: 500 24px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.key { position: absolute; display: flex; gap: 30px; font: 400 24px/1 var(--font-mono); color: var(--muted); }
.key span::before { content: ""; display: inline-block; width: 20px; height: 20px; border-radius: 5px; margin-right: 10px; vertical-align: -3px; background: var(--c); }

/* bars */
/* One grid for every row, so the label column is as wide as the longest label. */
.bars { position: absolute; left: 860px; width: 960px; display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 26px 24px; }
.bars .row { display: contents; }
.bars .lbl { font: 500 30px/1.1 var(--font-mono); color: var(--muted); text-align: right; white-space: nowrap; }
.bars .row.lit .lbl { color: var(--ink); }
.bars .trk { position: relative; height: 74px; }
.bars .b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--dim); border-radius: 0 10px 10px 0; }
.bars .row.lit .b { background: var(--accent); }
.bars .v { position: absolute; top: 50%; transform: translateY(-50%); font: 600 34px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars .cap { position: absolute; top: -40px; bottom: -40px; border-left: 4px dashed var(--mark); }
.bars .cap span { position: absolute; top: -34px; right: 14px; white-space: nowrap; font: 500 24px/1 var(--font-mono); color: var(--mark); }

/* flow */
.flow svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.flow path { fill: none; stroke: var(--rule); stroke-width: 6; }
.node { position: absolute; border: 4px solid var(--ink); border-radius: 22px; background: var(--paper); display: grid; place-items: center; text-align: center; font: 700 38px/1.05 var(--font-display); font-stretch: 90%; padding: 0 20px; }
.node.lit { border-color: var(--accent); color: var(--accent); }
.node.reached { border-color: var(--accent); }
.node small { display: block; font: 400 22px/1.2 var(--font-mono); color: var(--muted); margin-top: 8px; font-stretch: 100%; }
.dot { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 8px var(--accent-wash); }
.dot.stop { background: var(--mark); box-shadow: 0 0 0 10px color-mix(in oklab, var(--mark) 22%, transparent); }
.say { position: absolute; white-space: nowrap; font: 600 32px/1 var(--font-display); font-stretch: 92%; padding: 14px 20px; border-radius: 12px; background: var(--ink); color: var(--paper); }
.say.bad { background: var(--mark); color: #fff; }

/* end */
.pills { position: absolute; left: 120px; top: 640px; display: flex; gap: 28px; flex-wrap: wrap; }
.pill { font: 600 38px/1 var(--font-display); font-stretch: 92%; padding: 26px 36px; border-radius: 999px; border: 3px solid var(--hero-ink); color: var(--hero-ink); }
.pill.solid { background: var(--hero-ink); color: var(--hero); }
.foot { position: absolute; left: 120px; right: 120px; bottom: 90px; font: 400 32px/1.3 var(--font-body); color: var(--hero-muted); }
</style>

<div class="page">
  <header class="top">
    <div class="kicker" id="kicker">Build notes in motion</div>
    <h1 id="title"></h1>
    <p id="dek"></p>
  </header>
  <div class="screen" id="screen" role="img"><div class="stage" id="stage"></div></div>
  <div class="bar" id="bar">
    <button type="button" id="play" aria-label="Play or pause">▶</button>
    <div class="scrub"><input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Seek"><div class="track"><div class="fill"></div></div></div>
    <span id="time">0:00</span><span class="chap" id="chap"></span>
  </div>
  <div class="hint" id="hint">Space plays or pauses · ← → jump a scene · click the frame to pause</div>
</div>

<!-- Filled by motion.mjs: the script, with each scene's length set, and the images it uses. -->
<script type="application/json" id="assets">{}</script>
<script type="application/json" id="cut">{"title": "", "scenes": []}</script>

<script>
(() => {
  const CUT = JSON.parse(document.getElementById("cut").textContent);
  const ASSETS = JSON.parse(document.getElementById("assets").textContent);
  const asset = (path) => ASSETS[path] || path;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const E = {
    out: (p) => 1 - Math.pow(1 - p, 3),
    inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    back: (p) => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2),
    linear: (p) => p,
  };
  const seg = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  // Script text is plain; *words* become an underlined emphasis.
  const rich = (s) => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const h = (tag, cls, html) => { const el = document.createElement(tag); if (cls) el.className = cls; if (html != null) el.innerHTML = html; return el; };
  const rise = (el, p, d = 40) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * d}px)`; };
  const pop = (el, p) => { el.style.opacity = clamp(p * 1.6); el.style.transform = `scale(${lerp(0.86, 1, E.back(clamp(p)))})`; };
  const place = (el, x, y, w, hgt) => { el.style.left = x + "px"; el.style.top = y + "px"; if (w != null) el.style.width = w + "px"; if (hgt != null) el.style.height = hgt + "px"; };
  const W = 1920, H = 1080, SIDE = { x: 800, y: 190, w: 1000, h: 820 };

  function frame(d, hero) {
    const el = h("div", "scene" + (hero ? " hero" : ""));
    el.append(h("div", "meta", `<span>${esc(CUT.product || "")}</span><span>${esc(d.label || "")}</span>`));
    return el;
  }
  // The copy block: kicker, headline, sub, rising in turn. Its headline shrinks to fit (see fit()).
  function copy(d, cls = "") {
    const c = h("div", "copy " + cls);
    const parts = [];
    if (d.kicker) parts.push(h("div", "k", rich(d.kicker)));
    if (d.headline) parts.push(h("h2", "hd", rich(d.headline)));
    if (d.sub) parts.push(h("p", "sub", rich(d.sub)));
    c.append(...parts);
    return { el: c, render: (t) => parts.forEach((p, i) => rise(p, seg(t, 0.1 + i * 0.22, 0.8 + i * 0.22))) };
  }
  const fitBox = ([nw, nh], box) => { const s = Math.min(box.w / nw, box.h / nh); const w = nw * s, hh = nh * s; return { x: box.x + box.w - w, y: box.y + (box.h - hh) / 2, w, h: hh, s }; };

  const ICONS = {
    grid: `<svg viewBox="0 0 200 150"><rect x="2" y="2" width="96" height="146" rx="10" fill="var(--green)"/><rect x="104" y="2" width="94" height="86" rx="10" fill="var(--blue)"/><rect x="104" y="94" width="94" height="54" rx="10" fill="var(--red)"/></svg>`,
    play: `<svg viewBox="0 0 200 150"><rect x="3" y="3" width="194" height="144" rx="14" fill="none" stroke="currentColor" stroke-width="5"/><path d="M84 42 L128 70 L84 98 Z" fill="var(--accent)"/><line x1="24" y1="124" x2="176" y2="124" stroke="var(--rule)" stroke-width="6" stroke-linecap="round"/><line x1="24" y1="124" x2="88" y2="124" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/></svg>`,
    mail: `<svg viewBox="0 0 200 150"><rect x="3" y="12" width="194" height="132" rx="14" fill="none" stroke="currentColor" stroke-width="5"/><path d="M10 22 L100 88 L190 22" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linejoin="round"/></svg>`,
    check: `<svg viewBox="0 0 200 150"><circle cx="75" cy="75" r="70" fill="none" stroke="currentColor" stroke-width="5"/><path d="M42 76 L66 100 L110 50" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    clock: `<svg viewBox="0 0 200 150"><circle cx="75" cy="75" r="70" fill="none" stroke="currentColor" stroke-width="5"/><path d="M75 30 V75 L105 92" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    code: `<svg viewBox="0 0 200 150"><rect x="3" y="3" width="194" height="144" rx="14" fill="none" stroke="currentColor" stroke-width="5"/><path d="M70 50 L40 75 L70 100 M130 50 L160 75 L130 100" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    bolt: `<svg viewBox="0 0 200 150"><path d="M110 4 L40 86 H92 L80 146 L160 58 H106 Z" fill="var(--accent)"/></svg>`,
  };

  // Each kind builds its scene once and returns render(t): the whole scene at t seconds into it.
  // The timings here are what motion.mjs's BASE lengths assume; change them together.
  const KINDS = {
    title(d) {
      const el = frame(d, true);
      const c = h("div", "copy full");
      const k = d.kicker ? h("div", "k", rich(d.kicker)) : null;
      const hd = h("h2", "hd big");
      const words = d.headline.split(" ").map((w) => { const s = h("span", "w", rich(w)); hd.append(s, " "); return s; });
      if (k) c.append(k);
      c.append(hd);
      el.append(c);
      let ticks, head;
      if (d.ticks?.length) {
        ticks = h("div", "ticks");
        d.ticks.forEach((x) => ticks.append(h("span", "", esc(x))));
        head = h("i"); ticks.append(head); el.append(ticks);
      }
      return { el, render(t) {
        if (k) rise(k, seg(t, 0.1, 0.7));

    const fromHash = () => { const k = parseInt(location.hash.slice(1), 10); return k >= 1 && k <= n ? k - 1 : null; };
    const toggleFull = () => {
      if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (screen.requestFullscreen || screen.webkitRequestFullscreen)?.call(screen);
    };
    prev.onclick = () => step(-1);
    next.onclick = () => step(1);
    document.getElementById("full").onclick = toggleFull;
    // The left third of the slide goes back; the rest goes on.
    screen.onclick = (e) => { const r = screen.getBoundingClientRect(); step(e.clientX - r.left < r.width / 3 ? -1 : 1); };
    addEventListener("keydown", (e) => {
      if (quiet(e)) return;
      const k = e.key;
      if (NEXT.has(k) || (k === " " && !e.shiftKey)) step(1);
      else if (PREV.has(k) || (k === " " && e.shiftKey)) step(-1);
      else if (k === "Home") go(0, false);
      else if (k === "End") go(n - 1, false);
      else if (k === "f" || k === "F") toggleFull();
      else return;
      e.preventDefault();
    });
    addEventListener("hashchange", () => { const k = fromHash(); if (k != null && k !== i) go(k); });
    function loop(now) {
      armed = false;
      // Draw while a slide plays, and once after fit() (which hides every scene) runs again on font load.
      if (!playing && shown >= 0) return;
      const dt = playing && last ? Math.min(0.1, (now - last) / 1000) : 0;
      if (playing) last = now;
      t += dt;
      if (t >= rest(i)) { t = rest(i); playing = false; }
      draw();
      if (playing) schedule();
    }
    document.fonts?.ready.then(schedule);
    // Print, and deck.mjs's PDF: every slide at rest, one to a page (the print rules are in the stylesheet).
    const page = document.head.appendChild(h("style", "", "@page { size: 1920px 1080px; margin: 0; }"));
    page.media = "print";
    // Run once per print (the exporter calls it, then beforeprint fires again); afterprint clears the flag.
    let sheeted = false;
    const sheets = () => {
      if (sheeted) return;
      sheeted = true;
      scenes.forEach((s) => { s.el.hidden = false; s.render(s.d.dur); s.el.style.opacity = 1; s.el.style.transform = ""; });
    };
    addEventListener("beforeprint", sheets);
    addEventListener("afterprint", () => { sheeted = false; shown = -1; updateChrome(); draw(); schedule(); });
    go(fromHash() ?? 0, true);
    // For checks and the PDF: which slide is showing, a slide at rest, a scene frozen at a moment, all slides for print.
    window.__cut = { total, problems, slides: n, deck: true,
      get state() { return { slide: i + 1, t, playing }; },
      go: (k, play) => go(k - 1, play),
      freeze(k, tt) { i = k; t = tt; playing = false; updateChrome(); draw(); },
      sheets };
    return;
  }

  let T = 0, playing = !reduce, last = 0;
  if (reduce) T = starts[0] + scenes[0].d.dur - 0.4;
  function draw() {
    const Tc = clamp(T, 0, total - 0.001), i = sceneAt(Tc);
    show(i, Tc - starts[i]);
    play.textContent = playing ? "❚❚" : "▶";
    scrub.value = T; fill.style.width = (T / total) * 100 + "%";
    timeEl.textContent = `${fmt(T)} / ${fmt(total)}`;
    chapEl.textContent = scenes[i].d.label || "";
  }
  function loop(now) {
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;
    if (playing) { T += dt; if (T >= total) { T = total; playing = false; } }
    draw();
    requestAnimationFrame(loop);
  }
  play.onclick = (e) => { e.stopPropagation(); if (T >= total - 0.01) T = 0; playing = !playing; };
  screen.onclick = () => play.click();
  scrub.oninput = () => { T = +scrub.value; playing = false; };
  addEventListener("keydown", (e) => {
    if (quiet(e)) return;
    if (e.key === " ") { e.preventDefault(); play.click(); }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); T = starts[clamp(sceneAt(T) + (e.key === "ArrowRight" ? 1 : -1), 0, scenes.length - 1)]; }
  });

  // For checks and export: freeze one scene at a time, and read what didn't fit.
  window.__cut = { total, problems, freeze(i, t) { playing = false; T = starts[i] + t; draw(); } };
  requestAnimationFrame(loop);
})();
</script>
