    .cp .room { fill: none; stroke: var(--ink); stroke-width: 2; }
    .cp .pc { fill: none; stroke: var(--muted); stroke-width: 1; }
    .cp .route { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
    .cp .wedge { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1; }
    .cp .ring { fill: var(--paper); stroke: var(--mark); stroke-width: 1.25; }
    .cp .num { font: 400 10.5px var(--font-note); fill: var(--ink); }
    .cp .lbl { font: 600 12px var(--font-display); fill: var(--ink); }
    .cp .sub { font: 400 10.5px var(--font-code); fill: var(--muted); }
    .cp .pl { font: 400 9.5px var(--font-code); fill: var(--muted); }
    .cp .dot { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5; }
  </style>
