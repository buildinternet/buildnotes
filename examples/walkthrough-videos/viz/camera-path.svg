<svg viewBox="0 0 341 394" role="img" aria-labelledby="path-t path-d" style="min-width:0;max-width:24rem;margin-inline:auto">
  <title id="path-t">The camera path of a room walkthrough, drawn over the room's plan</title>
  <desc id="path-d">Seen from above. The camera starts high outside the room's front-right corner, orbits round to the back-right, comes down into the back-right corner at eye level and looks across the room, rises to straight above the centre for the plan shot, and returns to where it started.</desc>
